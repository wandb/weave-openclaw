name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.0.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version-file: package.json

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check tag conflict
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists on origin"
            exit 1
          fi

      - name: Bump version files
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/bump-version.mjs "$VERSION"

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Create version bump commit and tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git add package.json openclaw.plugin.json src/service.ts pnpm-lock.yaml
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"

      - name: Push commit and tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$VERSION"

name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.0.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest

    steps:
      # github.token can't bypass the branch ruleset, so mint a token from the
      # weave-open-source GitHub App, which is on the ruleset bypass list.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          # weave-open-source App Client ID (public, not a secret):
          # github.com/organizations/wandb/settings/apps/weave-open-source
          client-id: Iv23lisBZStNzmWeRUFw
          private-key: ${{ secrets.WEAVE_OPEN_SOURCE_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: package.json

      # The bot's numeric user id builds the noreply email that links commits
      # to the weave-open-source[bot] account.
      - name: Look up app bot user id
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "user-id=$USER_ID" >> "$GITHUB_OUTPUT"

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Check tag conflict
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists on origin"
            exit 1
          fi

      - name: Bump version files
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          node scripts/release/bump-version.mjs "$VERSION"

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Create version bump commit and tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git add package.json openclaw.plugin.json src/config/version.ts pnpm-lock.yaml
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"

      - name: Push commit and tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$VERSION"

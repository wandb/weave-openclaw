name: ClawHub Validate

# Dry-run ClawHub publish to catch packaging/metadata errors before release.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Skip fork PRs: they get no OIDC token, which the reusable workflow needs
  # even in dry-run mode.
  dry-run:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read  # required by the reusable workflow's declared permissions
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908  # v0.23.1
    with:
      source: ${{ github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      owner: wandb
      dry_run: true

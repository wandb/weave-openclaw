name: ClawHub Validate

# Dry-run ClawHub publish so packaging, metadata, and source-provenance problems
# surface on PRs and main rather than at release time. No publish mutation.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # The reusable workflow resolves its own CLI source via GitHub OIDC, so it needs
  # id-token even in dry-run mode. PRs from forks are not granted an OIDC token, so
  # gate this to pushes and same-repo PRs; fork PRs skip cleanly instead of failing.
  dry-run:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@8e1bad4ac1f0d68309e168623c1c0179622e684d  # v0.20.0
    with:
      source: ${{ github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      owner: wandb
      dry_run: true

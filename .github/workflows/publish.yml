name: Publish Package

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to publish, for example v0.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.release_ref }}
  cancel-in-progress: false

jobs:
  # Shared version gate for both registries; npm-only checks live in publish-npm.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.inputs.release_ref }}
          fetch-depth: 0

      - name: Verify release tag and version
        env:
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
        run: |
          set -euo pipefail

          if ! git rev-parse -q --verify "refs/tags/${RELEASE_REF}" >/dev/null; then
            echo "::error::release_ref must be an existing tag, got '${RELEASE_REF}'"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          PLUGIN_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('openclaw.plugin.json', 'utf8')).version")"
          SERVICE_VERSION="$(node -p "(require('fs').readFileSync('src/config/version.ts','utf8').match(/PACKAGE_VERSION\\s*=\\s*\"([^\"]+)\"/)||[])[1] || ''")"

          if [ "${RELEASE_REF}" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${RELEASE_REF} does not match package.json version v${PACKAGE_VERSION}"
            exit 1
          fi

          if [ "${PLUGIN_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::openclaw.plugin.json version (${PLUGIN_VERSION}) does not match package.json (${PACKAGE_VERSION})"
            exit 1
          fi

          if [ "${SERVICE_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::src/config/version.ts PACKAGE_VERSION (${SERVICE_VERSION}) does not match package.json (${PACKAGE_VERSION})"
            exit 1
          fi

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.inputs.release_ref }}
          fetch-depth: 0

      - name: Check version not already on npm
        env:
          RELEASE_REF: ${{ github.event.inputs.release_ref }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="${RELEASE_REF#v}"
          if npm view "weave-openclaw@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::Version ${PACKAGE_VERSION} is already published to npm"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      # package.json carries the scoped name (@wandb/weave-openclaw) so ClawHub
      # publishing works, where the scope must match the publish owner. npm keeps
      # the original unscoped name, so rewrite it back before publishing here.
      - name: Publish to npm (unscoped name)
        run: |
          npm pkg set name=weave-openclaw
          pnpm publish --no-git-checks --access public

  # Sibling of publish-npm (both need verify, not each other): one failure
  # doesn't block the other, and "Re-run failed jobs" retries just the failed leaf.
  publish-clawhub:
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@a230d962db64019462c2c8ee400755eb92169908  # v0.23.1
    with:
      source: ${{ github.repository }}
      ref: ${{ github.event.inputs.release_ref }}
      owner: wandb
      dry_run: false
    # Optional: only for the first publish, before OIDC trusted publishing is set up.
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
